# docker-compose.yml

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-draftchess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB:       ${POSTGRES_DB:-draftchess}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-draftchess}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST:          postgres
      DB_PORT:          5432
      DB_USER:          ${POSTGRES_USER:-draftchess}
      DB_PASSWORD:      ${POSTGRES_PASSWORD:?}
      DB_NAME:          ${POSTGRES_DB:-draftchess}
      POOL_MODE:        transaction
      MAX_CLIENT_CONN:  100
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE:    5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      AUTH_TYPE:        scram-sha-256
      LISTEN_PORT:          6432
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U ${POSTGRES_USER:-draftchess}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:?}
        --appendonly yes
        --appendfsync everysec
        --notify-keyspace-events KExg
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


volumes:
  postgres_data:
  redis_data:
